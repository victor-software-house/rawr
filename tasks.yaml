    notes:
      - 2026-11-13, facts stream from the newest line back in 256 KiB parts; search and the closed list still read forward.
    completed: 2026-11-19T01:00:25
    evidence:
      - Facts stream from the newest line back (3bfe631), search scans each transcript backwards in parts and yields between them, and the closed list reads on its own thread; all 112 tests pass.
    disposition: completed

