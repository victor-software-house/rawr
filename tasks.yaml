# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 6
prefix: RAWR
active: RAWR-013
queue:
  - id: RAWR-013
    title: Open every pane and its sessions in one rawr app
    scope: app
    outcome: >-
      Bare rawr opens one app that lists every pane, its sessions and a search, and
      goes to or resumes any of them.
    blocked_by: []
    acceptance:
      - Every task in the rawr-app change is checked off with evidence.
      - The maintainer approves the preview before the pull request opens.
    plan: openspec/changes/rawr-app/proposal.md
    notes:
      - '2026-11-13, before the pull request: the rawr-app change still describes three layouts and ctrl+l, while the app now has two columns and a drawer; AGENTS.md rules 3 and 4 still name pick and say the binary starts nothing else, but the app opens files with /usr/bin/open; clippy and the test suite are not yet clean on feat/tui; the branch is one commit behind main.'

  - id: RAWR-006
    title: Print shell integration and add the Claude hook on request
    scope: cli
    outcome: >-
      bash, zsh and fish users get rawr working from one printed line, and Claude
      Code records sessions after one explicit command.
    blocked_by: []
    acceptance:
      - rawr setup claude adds the SessionStart hook once and reports added or unchanged; --dry-run changes nothing.
      - rawr init <bash|zsh|fish> prints a static script that runs rawr pick once before the first prompt in a Rex pane.
    plan: openspec/changes/install-and-shells/proposal.md
    notes:
      - 2026-11-07, setup claude stays in rawr, since it edits Claude Code settings only.
      - 2026-11-07, pick and find resume the chosen session themselves, so rawr prints no command and needs no per-shell quoting; ctl-core shell integration keeps only the once-before-first-prompt hook.
      - 2026-11-07, ctl-core owns init as a shared shell-integration feature in ctl-core stack 182; rawr adopts it after a ctl-core release.

  - id: RAWR-007
    title: Ship macOS arm64 and Linux glibc binaries with an install script
    scope: release
    outcome: >-
      A release carries darwin-arm64, linux-x64 and linux-arm64 tarballs with
      digests, and install.sh installs the right one without editing shell files.
    blocked_by: []
    acceptance:
      - verctl assets prints the three targets.
      - install.sh verifies the digest, installs into RAWR_INSTALL_DIR or ~/.local/bin, and prints the rawr init line.
    plan: openspec/changes/install-and-shells/proposal.md

  - id: RAWR-008
    title: Install from the organization Homebrew tap
    scope: release
    outcome: >-
      brew install victor-software-house/tap/rawr installs the binary and its
      completions, and each release updates the formula.
    blocked_by: []
    acceptance:
      - victor-software-house/homebrew-tap holds a rawr formula whose brew test passes.
      - A release updates the formula version and digests without a hand edit.
    plan: openspec/changes/install-and-shells/proposal.md

  - id: RAWR-009
    title: Offer shell completions through ctl-core
    scope: cli
    outcome: >-
      rawr completion <bash|zsh|fish> prints static completions from the shared
      ctl-core verb.
    blocked_by: []
    acceptance:
      - rawr depends on a ctl-core release with the completion verb, and the bash script names every command.
    plan: openspec/changes/install-and-shells/proposal.md
    notes:
      - ctl-core owns the verb; its research and OpenSpec change come first, in that repository.

  - id: RAWR-010
    title: Complete rawr's verbs and flags in bash, zsh and fish
    scope: src/main.rs
    outcome: >-
      rawr completion <shell> prints a registration script, and Tab completes from
      the installed binary
    blocked_by: []
    acceptance:
      - rawr completion zsh prints a script for rawr and exits 0, proved by the unit test in CI
      - In zsh with the script loaded, rawr <Tab> offers every verb
    plan: openspec/changes/shell-completion/proposal.md

  - id: RAWR-012
    title: "Supervise Claude Code agents in Rex: status, drain, restart and install"
    scope: supervisor
    outcome: >-
      rawr shows every Rex pane's Claude Code status, drains the sessions and
      restarts the Rex server once every pane is idle, and installs from Homebrew with one
      setup command
    blocked_by: []
    acceptance:
      - The maintainer approves the rex-supervisor design and its open points are answered in it
      - Each decision in the design maps to a row with its own OpenSpec change
    plan: openspec/changes/rex-supervisor/proposal.md

  - id: RAWR-014
    title: Serve every rawr window from one daemon
    scope: app
    outcome: >-
      One daemon reads Rex, transcripts and the search catalog for every window, and
      each window only draws.
    blocked_by: []
    acceptance:
      - Every task in the app-daemon change is checked off with evidence.
    plan: openspec/changes/app-daemon/proposal.md

  - id: RAWR-022
    title: Drain Rex before a restart without cutting agents
    scope: supervisor
    outcome: A Rex restart waits for every agent to reach a safe point.
    blocked_by:
      - RAWR-012
    acceptance:
      - Every task in the drain-and-restart change is checked off with evidence.
    plan: openspec/changes/drain-and-restart/proposal.md

  - id: RAWR-023
    title: Set rawr up in one step and serve its daemon from the tap
    scope: install
    outcome: >-
      One command wires rawr into the shell and Claude Code, and the tap installs it
      with its daemon.
    blocked_by:
      - RAWR-012
    acceptance:
      - Every task in the setup-and-tap change is checked off with evidence.
    plan: openspec/changes/setup-and-tap/proposal.md
    notes:
      - 2026-11-13, overlaps RAWR-006 and RAWR-008, whose install-and-shells change predates the daemon; one of the two changes should absorb the other.

  - id: RAWR-027
    title: Wrap rawr status cells instead of hiding a column
    scope: cli
    outcome: rawr status stays readable in a narrow terminal.
    blocked_by: []
    acceptance:
      - In an 80-column terminal, rawr status shows every column, and long cells wrap inside them.
    notes:
      - 2026-11-23, rawr status at about 80 columns showed the Title column as a single ellipsis while Folder wrapped.
      - Check first whether the ctl-core Table pinned in Cargo.toml (=0.7.4) can wrap cells; the local ctl-core checkout is at 0.6.13, so this is unverified.

  - id: RAWR-028
    title: Enter on a search hit opens the session instead of resuming it
    scope: app
    outcome: Choosing a search hit never starts Claude by surprise.
    blocked_by: []
    acceptance:
      - Enter on a search hit closes the search and shows that session in the session detail, and r resumes it from there.
      - A test covers Enter on a hit whose session has no pane.
    notes:
      - 2026-11-23, open_hit in src/app/state.rs resumes a hit with no running pane at once; the maintainer asked for no immediate resume.

  - id: RAWR-029
    title: Show readable text for search hits inside tool calls
    scope: app
    outcome: Every search snippet reads as text a person wrote or Claude printed.
    blocked_by: []
    acceptance:
      - A hit inside a tool call input or result shows that text, never transcript JSON.
    notes:
      - 2026-11-23, searching rate showed a snippet with raw JSON keys such as usage and input_tokens for a hit in a Bash tool call.

  - id: RAWR-030
    title: Title the pane after its Claude session while rawr runs
    scope: app
    outcome: A Rex tab running rawr reads as the work in it, not as rawr.
    blocked_by: []
    acceptance:
      - While a stand-in (rawr --startup) runs in a pane, the Rex tab title is the title of its newest resumable Claude session, or the folder name when it has none; the floating app leaves the title alone.
      - When the stand-in gives the terminal back, the pane title is empty again, as a new shell leaves it.
    notes:
      - 2026-11-23, after rawr --startup, most tabs in the Rex sidebar read rawr plus a folder; the maintainer asked that only the source say rawr, as Claude Code panes say claude.
    plan: openspec/changes/stand-in/proposal.md

  - id: RAWR-031
    title: Split the stand-in from the floating app, and report only own state
    scope: app
    outcome: >-
      A killed pane offers only its own sessions, the full app opens floating on
      cmd+alt+r, and no rawr window changes its Rex status because another pane changed.
    blocked_by: []
    acceptance:
      - rawr --startup lists only the sessions recorded for its pane, newest first, with the selected one in detail; r resumes there.
      - The README names cmd+alt+r as the way to open rawr and gives the init.lua action that provides it.
      - A status change in one pane sends no OSC 7501 report from a stand-in in another pane, and the floating app reports only when it flips between idle and blocked; tests prove both.
      - A stand-in reports idle once, with app rawr and its session title as the title, never rawr; the floating app reports idle with a constant line and the title rawr, and blocked with a constant line while any agent needs the user.
    notes:
      - 2026-11-23, the maintainer saw every rawr stand-in jump to the top of Rex Activity at once, because each one reported counts over all panes.
      - '2026-11-23, the maintainer chose: stand-in shows this pane sessions only; full app is the floating window; each reports its own state only.'
      - 2026-11-23, the maintainer restated that only the origin says rawr, as Claude sessions come from claude; RAWR-030 covers the tab title, this row the status record.
    plan: openspec/changes/stand-in/proposal.md
