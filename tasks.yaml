      - 2026-11-13, implemented on feat/tui (f8b33a1); not yet in the rawr-app change.
    completed: 2026-11-19T01:00:45
    evidence:
      - 'f8b33a1 and c0df12b: the last day of sessions no open pane holds show under Closed, read on their own thread, and going to one resumes it.'
    disposition: completed

