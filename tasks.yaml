# yaml-language-server: $schema=https://raw.githubusercontent.com/victor-software-house/qctl/main/schema/tasks.schema.json
schema_version: 6
prefix: RAWR
active: RAWR-001
queue:
  - id: RAWR-001
    title: Offer a restored pane its sessions in a full-screen picker
    scope: picker
    outcome: >-
      A restored Rex pane offers its Claude Code sessions in a full-screen picker
      that takes keys and the mouse.
    blocked_by: []
    acceptance:
      - Every task in the fullscreen-picker change is checked off with evidence.
      - The maintainer's preview in a Rex pane resumes a session by key and by click.
    plan: openspec/changes/fullscreen-picker/proposal.md

  - id: RAWR-003
    title: Find any local Claude Code session from the picker
    scope: picker
    outcome: >-
      Typing in the picker searches every resumable local Claude Code session, not
      only the pane's own.
    blocked_by: []
    acceptance:
      - Typing filters the list on each key press, matching titles, folders, prompts and session IDs.
      - Search reads one prompt-history file, one projects listing, and the first and last 64 KiB and the custom-title.json of each listed transcript, once per load.
    notes:
      - Local sessions only; older sessions are a horizon row.
    plan: openspec/changes/session-search/proposal.md

  - id: RAWR-006
    title: Print shell integration and add the Claude hook on request
    scope: cli
    outcome: >-
      bash, zsh and fish users get rawr working from one printed line, and Claude
      Code records sessions after one explicit command.
    blocked_by: []
    acceptance:
      - rawr setup claude adds the SessionStart hook once and reports added or unchanged; --dry-run changes nothing.
      - rawr init <bash|zsh|fish> prints a static script that runs rawr pick once before the first prompt in a Rex pane.
    plan: openspec/changes/install-and-shells/proposal.md
    notes:
      - 2026-11-07, setup claude stays in rawr, since it edits Claude Code settings only.
      - 2026-11-07, pick and find resume the chosen session themselves, so rawr prints no command and needs no per-shell quoting; ctl-core shell integration keeps only the once-before-first-prompt hook.
      - 2026-11-07, ctl-core owns init as a shared shell-integration feature in ctl-core stack 182; rawr adopts it after a ctl-core release.

  - id: RAWR-007
    title: Ship macOS arm64 and Linux glibc binaries with an install script
    scope: release
    outcome: >-
      A release carries darwin-arm64, linux-x64 and linux-arm64 tarballs with
      digests, and install.sh installs the right one without editing shell files.
    blocked_by: []
    acceptance:
      - verctl assets prints the three targets.
      - install.sh verifies the digest, installs into RAWR_INSTALL_DIR or ~/.local/bin, and prints the rawr init line.
    plan: openspec/changes/install-and-shells/proposal.md

  - id: RAWR-008
    title: Install from the organization Homebrew tap
    scope: release
    outcome: >-
      brew install victor-software-house/tap/rawr installs the binary and its
      completions, and each release updates the formula.
    blocked_by: []
    acceptance:
      - victor-software-house/homebrew-tap holds a rawr formula whose brew test passes.
      - A release updates the formula version and digests without a hand edit.
    plan: openspec/changes/install-and-shells/proposal.md

  - id: RAWR-009
    title: Offer shell completions through ctl-core
    scope: cli
    outcome: >-
      rawr completion <bash|zsh|fish> prints static completions from the shared
      ctl-core verb.
    blocked_by: []
    acceptance:
      - rawr depends on a ctl-core release with the completion verb, and the bash script names every command.
    plan: openspec/changes/install-and-shells/proposal.md
    notes:
      - ctl-core owns the verb; its research and OpenSpec change come first, in that repository.

  - id: RAWR-010
    title: Complete rawr's verbs and flags in bash, zsh and fish
    scope: src/main.rs
    outcome: >-
      rawr completion <shell> prints a registration script, and Tab completes from
      the installed binary
    blocked_by: []
    acceptance:
      - rawr completion zsh prints a script for rawr and exits 0, proved by the unit test in CI
      - In zsh with the script loaded, rawr <Tab> offers every verb
    plan: openspec/changes/shell-completion/proposal.md

  - id: RAWR-011
    title: Mark a waiting picker's pane as needing attention in Rex
    scope: src/picker/terminal.rs
    outcome: >-
      While the picker is open, its Rex tab shows a needs-attention dot, cleared when
      the picker closes
    blocked_by: []
    acceptance:
      - Both OSC 7501 sequences match the protocol, proved by the unit test in CI
      - A background tab running rawr pick shows the dot, and the dot is gone after Esc
    plan: openspec/changes/pane-status/proposal.md

  - id: RAWR-012
    title: "Supervise Claude Code agents in Rex: status, drain, restart and install"
    scope: supervisor
    outcome: >-
      rawr shows every Rex pane's Claude Code status, drains the sessions and
      restarts the Rex server once every pane is idle, and installs from Homebrew with one
      setup command
    blocked_by: []
    acceptance:
      - The maintainer approves the rex-supervisor design and its open points are answered in it
      - Each decision in the design maps to a row with its own OpenSpec change
    plan: openspec/changes/rex-supervisor/proposal.md

  - id: RAWR-013
    title: Open every pane and its sessions in one rawr app
    scope: app
    outcome: >-
      Bare rawr opens one app that lists every pane, its sessions and a search, and
      goes to or resumes any of them.
    blocked_by: []
    acceptance:
      - Every task in the rawr-app change is checked off with evidence.
      - The maintainer approves the preview before the pull request opens.
    plan: openspec/changes/rawr-app/proposal.md

  - id: RAWR-014
    title: Serve every rawr window from one daemon
    scope: app
    outcome: >-
      One daemon reads Rex, transcripts and the search catalog for every window, and
      each window only draws.
    blocked_by: []
    acceptance:
      - Every task in the app-daemon change is checked off with evidence.
    plan: openspec/changes/app-daemon/proposal.md

  - id: RAWR-015
    title: Draw each transcript entry as Claude Code draws it
    scope: app
    outcome: >-
      A session's prompts and tool calls read as Claude Code's own transcript rows,
      not raw tags and JSON.
    blocked_by:
      - RAWR-013
    acceptance:
      - Teammate messages, peer messages, task notifications, shell input and output, slash commands, command output and plain prompts each show as Claude Code's collapsed row shows them.
      - Tool calls show Claude Code's tool name and argument summary, such as Update(path) for Edit.
      - Entries Claude Code draws nothing for, such as ticks and command caveats, are left out.
    notes:
      - 'Source of truth: the recovered Claude Code source, product/src/tui/repl/messages/user-text-message.tsx and the views it calls.'

  - id: RAWR-016
    title: Stream a session's facts from its newest line backwards
    scope: app
    outcome: >-
      A selected session shows its newest prompts, tool calls and tasks at once and
      fills in older ones as they are read.
    blocked_by:
      - RAWR-014
    acceptance:
      - The first facts of a session appear before its whole transcript is read, newest first.
      - Selecting another session stops reading the first and reads the new one next.
      - Search, facts and the closed list each stream in parts and yield to the newest request.
    notes:
      - 2026-11-13, facts stream from the newest line back in 256 KiB parts; search and the closed list still read forward.

  - id: RAWR-017
    title: List sessions whose pane was closed
    scope: app
    outcome: >-
      A session whose Rex pane was closed stays in the list, under Closed, and
      resumes from it.
    blocked_by:
      - RAWR-013
    acceptance:
      - Sessions written in the last day that no open pane holds show under Closed.
      - Going to a closed session resumes it.
    notes:
      - 2026-11-13, implemented on feat/tui (f8b33a1); not yet in the rawr-app change.

  - id: RAWR-018
    title: Read a session's task list as Claude Code keeps it
    scope: app
    outcome: >-
      The session view's task list matches the task list Claude Code shows for that
      session.
    blocked_by:
      - RAWR-014
    acceptance:
      - A session's done and open task counts in rawr equal those in Claude Code's task list.
    notes:
      - 2026-11-13, a session showed 5 of 33 tasks done with many finished ones marked open; task ids are assumed sequential.
archive:
  - id: RAWR-002
    title: Parse and report through ctl-core
    scope: cli
    outcome: >-
      rawr parses its commands, prints help and reports errors through ctl-core, as
      the other ctl tools do.
    completed: 2026-11-07T23:28:32
    evidence:
      - 0b96b8df65e246b95ff6416f3a4203b0987c9fda
    disposition: completed
horizon:
  - id: RAWR-004
    title: One shared process for every pane's picker
    scope: architecture
    outcome: >-
      One long-lived process holds the session list and serves the picker in every
      pane, so no pane rescans on its own.
    reason: deferred
    open: >-
      A per-pane scan is fast enough today, and a daemon adds lifecycle, sockets and
      upgrades that a small public tool would have to own.

  - id: RAWR-005
    title: Search older sessions through session-lake
    scope: picker
    outcome: >-
      The picker also finds sessions whose local transcripts were pruned, through
      session-lake.
    reason: deferred
    open: session-lake has no public interface rawr can depend on.
