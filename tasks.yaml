horizon:
  - id: RAWR-004
    title: One shared process for every pane's picker
    scope: architecture
    outcome: >-
      One long-lived process holds the session list and serves the picker in every
      pane, so no pane rescans on its own.
    reason: deferred
    open: >-
      A per-pane scan is fast enough today, and a daemon adds lifecycle, sockets and
      upgrades that a small public tool would have to own.

  - id: RAWR-005
    title: Search older sessions through session-lake
    scope: picker
    outcome: >-
      The picker also finds sessions whose local transcripts were pruned, through
      session-lake.
    reason: deferred
    open: session-lake has no public interface rawr can depend on.

  - id: RAWR-024
    title: Mirror the pane order between rawr and the Rex sidebar
    scope: app
    outcome: Reordering panes in rawr reorders them in Rex, and the reverse.
    reason: deferred
    open: The app ships first.

  - id: RAWR-025
    title: Group the panes list by Rex session
    scope: app
    outcome: The panes list can show each Rex session as a group.
    reason: deferred
    open: The app ships first.

  - id: RAWR-026
    title: Switch the app between view modes
    scope: app
    outcome: The app offers more than one view of its panes and sessions.
    reason: deferred
    open: The app ships first.
