name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It releases, from HEAD, each version HEAD holds whose release is
# incomplete, builds its binaries, then opens or updates the Version PR from
# .changeset.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
      id-token: write # the called workflow's publish job requests it
    uses: victor-software-house/verctl/.github/workflows/release.yml@7db72ad530b35bda6d7217606b1308f54168b710 # v0.8.6-rc.8
    with:
      mise-version: 2026.11.12
      mise-env: ci,release
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      release-mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
      release-mirror-ci-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}

  # Points the rawr formula in victor-software-house/homebrew-tap at the
  # version Cargo.toml holds, whenever the tap's formula names another one and
  # that version's Release is published with both tarballs. A run that finds
  # the Release still a draft waits for a later run, which verctl's release
  # job starts on the next push or dispatch. The workflow token cannot reach
  # another repository, so the dispatch goes as the Version Packages App, and
  # the tap's bump workflow checks each tarball's digest before it moves the
  # formula.
  tap:
    name: Homebrew tap
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the version with the tap's formula
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA_URL: https://raw.githubusercontent.com/${{ github.repository_owner }}/homebrew-tap/main/Formula/rawr.rb
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          tapped=$(curl -fsSL "$FORMULA_URL" | sed -n 's/^  version "\(.*\)"$/\1/p')
          if [[ $version == "$tapped" ]]; then
            echo "The tap's formula is at ${version} already."
            exit 0
          fi
          if ! release=$(gh release view "v${version}" --json isDraft,assets); then
            echo "::notice::Release v${version} does not exist yet, so the formula stays at ${tapped}."
            exit 0
          fi
          if [[ $(jq -r .isDraft <<<"$release") != false ]]; then
            echo "::notice::Release v${version} is a draft, so the formula stays at ${tapped}."
            exit 0
          fi
          for asset in "rawr_${version}_macos_arm64.tar.gz" "rawr_${version}_linux_x64.tar.gz"; do
            if ! jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' <<<"$release" >/dev/null; then
              echo "::error::Release v${version} is published without ${asset}."
              exit 1
            fi
          done
          echo "version=${version}" >>"$GITHUB_OUTPUT"
      - name: Mint the dispatch token
        if: steps.version.outputs.version != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write
      - name: Dispatch the bump
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # One tarball per line, as the bump workflow reads a formula's assets.
          assets=$(printf '%s\n' "rawr_${VERSION}_macos_arm64.tar.gz" "rawr_${VERSION}_linux_x64.tar.gz")
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/homebrew-tap/dispatches" \
            -f event_type=release -f "client_payload[formula]=rawr" -f "client_payload[tag]=v${VERSION}" \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" -f "client_payload[asset]=${assets}"
